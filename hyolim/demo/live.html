<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통화 시험</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --sub:#6b6b66; --line:#e3e2dd; --accent:#2f6fde; --ok:#1f8a4c; --warn:#b4541a; --bad:#c23b3b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#1f1f1d; --ink:#ecebe6; --sub:#a3a29c; --line:#34332f; --accent:#6c9ef0; --ok:#4cc27e; --warn:#e08a52; --bad:#e46b6b; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; display:grid; gap:16px; grid-template-columns: 1fr 300px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h1 { font-size:20px; margin:0 0 4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  input { font:inherit; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  label { color:var(--sub); font-size:13px; }
  #status { font-weight:600; }
  .turn { border-top:1px solid var(--line); padding:10px 0; }
  .turn:first-child { border-top:0; }
  .who { font-size:12px; color:var(--sub); }
  .heard { margin:2px 0 6px; }
  .ai { margin:2px 0 6px; color:var(--accent); }
  .meta { font-size:13px; color:var(--sub); display:flex; gap:12px; flex-wrap:wrap; }
  .pill { padding:1px 8px; border-radius:99px; border:1px solid var(--line); font-size:12px; }
  .good { color:var(--ok); } .mid { color:var(--warn); } .bad { color:var(--bad); }
  .truth { width:100%; margin-top:6px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td { padding:3px 4px; border-top:1px solid var(--line); vertical-align:top; }
  .mono { font-variant-numeric: tabular-nums; }
  .level { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .level > div { height:100%; width:0; background:var(--ok); transition:width .05s; }
</style>
</head>
<body>
<main>
  <section>
    <div class="card">
      <h1>하루온 상담 통화 시험</h1>
      <div class="row" style="margin:8px 0">
        <button id="startBtn" class="primary">통화 시작</button>
        <button id="stopBtn" disabled>통화 종료</button>
        <label><input type="checkbox" id="auto" checked> 답이 끝나면 자동으로 다음 말 듣기</label>
      </div>
      <div class="row" style="margin-bottom:8px">
        <label>발신번호 <input id="callerPhone" placeholder="비워 두면 미등록" size="13"></label>
        <label>현재 시각 <input id="now" value="2026-10-08 (목) 14:00" size="20"></label>
      </div>
      <div id="status">대기 중 — 이어폰을 끼고 '통화 시작'을 누르세요.</div>
      <div class="level" style="margin-top:6px"><div id="lvl"></div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="who">대화 기록 (턴마다: 들은 말 → AI 답 → 함수·시간). 실제로 한 말을 적어 두면 번호를 제대로 알아들었는지 채점합니다.</div>
      <div id="log"></div>
    </div>
  </section>
  <aside class="card">
    <div class="who" style="margin-bottom:6px">시험용 고객 (모의 데이터)</div>
    <div class="who">시험용 전화번호·주문번호는 로컬의 data/mock_db.json 에서 골라 쓰세요.<br>(대회 데이터라 저장소에는 넣지 않았습니다)</div>
    <div class="who" style="margin-top:10px">예: "배송 언제 와요?" → "공일공 사구오칠 육구육육이요"<br>"반품하고 싶어요" / "혈압약 먹는데 같이 먹어도 돼요?" / "전화 주문하고 싶어요"</div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
let ws, ctx, node, stream, playAt = 0, inTurn = false, turnNo = 0, active = false;

function setStatus(t) { $('status').textContent = t; }

async function startCall() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  await new Promise((ok, bad) => { ws.onopen = ok; ws.onerror = bad; });
  ws.onmessage = onMsg;
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(stream);
  const code = `
    class Cap extends AudioWorkletProcessor {
      constructor() { super(); this.ratio = sampleRate / 16000; this.pos = 0; this.buf = []; }
      process(inputs) {
        const ch = inputs[0][0]; if (!ch) return true;
        for (let i = 0; i < ch.length; i++) {
          this.pos += 1;
          if (this.pos >= this.ratio) { this.pos -= this.ratio; this.buf.push(ch[i]); }
          if (this.buf.length === 320) {
            const out = new Int16Array(320);
            for (let k = 0; k < 320; k++) out[k] = Math.max(-1, Math.min(1, this.buf[k])) * 32767;
            this.port.postMessage(out.buffer, [out.buffer]); this.buf = [];
          }
        }
        return true;
      }
    }
    registerProcessor('cap', Cap);`;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: 'application/javascript' })));
  node = new AudioWorkletNode(ctx, 'cap');
  node.port.onmessage = (e) => {
    const a = new Int16Array(e.data);
    let s = 0; for (const v of a) s += v * v;
    $('lvl').style.width = Math.min(100, Math.sqrt(s / a.length) / 60) + '%';
    if (inTurn && ws.readyState === 1) ws.send(e.data);
  };
  src.connect(node);
  active = true;
  $('startBtn').disabled = true; $('stopBtn').disabled = false;
  beginTurn();
}

function beginTurn() {
  if (!active || inTurn) return;
  ws.send(JSON.stringify({ type: 'start_turn', caller_phone: $('callerPhone').value.replace(/\D/g, '') || null, now: $('now').value }));
}

function play(buf) {
  const a = new Int16Array(buf); if (!a.length) return;
  const f = new Float32Array(a.length); for (let i = 0; i < a.length; i++) f[i] = a[i] / 32768;
  const ab = ctx.createBuffer(1, f.length, 16000); ab.copyToChannel(f, 0);
  const s = ctx.createBufferSource(); s.buffer = ab; s.connect(ctx.destination);
  playAt = Math.max(playAt, ctx.currentTime + 0.02); s.start(playAt); playAt += ab.duration;
}

function fmt(x, good, ok) { if (x == null) return '<span class="mid">—</span>'; const c = x <= good ? 'good' : (x <= ok ? 'mid' : 'bad'); return `<span class="${c}">${x.toFixed(2)}초</span>`; }

function onMsg(e) {
  if (typeof e.data !== 'string') { play(e.data); return; }
  const m = JSON.parse(e.data);
  if (m.type === 'turn_started') { inTurn = true; turnNo = m.turn; setStatus(`듣는 중… (턴 ${m.turn}) 말씀하세요`); }
  if (m.type === 'server' && m.event.type === 'debug.heard') setStatus(`들은 말: "${m.event.text}" — 답하는 중`);
  if (m.type === 'turn_done') {
    inTurn = false;
    const r = m.record;
    const tools = r.tool_calls.map(c => `${c.name}(${Object.entries(c.arguments).filter(([k, v]) => v && !['reason','refund_account'].includes(k)).map(([k, v]) => v).join(', ')}) → ${c.status}`).join('<br>') || '없음';
    const div = document.createElement('div'); div.className = 'turn';
    div.innerHTML = `<div class="who">턴 ${r.turn} · 들은 말</div><div class="heard">${r.heard || '<i>(못 들음)</i>'}</div>
      <div class="who">AI</div><div class="ai">${r.said || '<i>(말 없음)</i>'}</div>
      <div class="meta"><span>첫 소리 ${fmt(r.first_sound, 1.5, 3)}</span><span>조회 뒤 답 ${r.tool_calls.length ? fmt(r.after_tool_sound, 3.5, 6) : '—'}</span>
      ${r.spoke_before_end ? '<span class="pill bad">말 도중 끼어듦</span>' : ''}<span>함수: ${tools}</span></div>
      <input class="truth" placeholder="실제로 한 말 (선택) — 적고 Enter" data-turn="${r.turn}">`;
    div.querySelector('.truth').addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ws.send(JSON.stringify({ type: 'truth', turn: +ev.target.dataset.turn, text: ev.target.value })); ev.target.style.borderColor = 'var(--ok)'; }
    });
    $('log').prepend(div);
    setStatus(`턴 ${r.turn} 끝 · 기록: ${m.log}`);
    if ($('auto').checked && active) {
      const wait = Math.max(0, (playAt - ctx.currentTime) * 1000) + 400;
      setTimeout(beginTurn, wait);                        // AI 목소리가 다 끝난 뒤 다음 말을 듣는다
    } else if (active) {
      setStatus(`턴 ${r.turn} 끝 — 다음 말을 하려면 아래 버튼`); showNext();
    }
  }
}

function showNext() {
  if ($('nextBtn')) return;
  const b = document.createElement('button'); b.id = 'nextBtn'; b.textContent = '다음 말하기'; b.className = 'primary';
  b.onclick = () => { b.remove(); beginTurn(); };
  $('status').after(b);
}

function stopCall() {
  active = false; inTurn = false;
  try { node && node.disconnect(); stream && stream.getTracks().forEach(t => t.stop()); ws && ws.close(); } catch (e) {}
  $('startBtn').disabled = false; $('stopBtn').disabled = true;
  setStatus('통화 종료 — 터미널에서 python3 demo/score_live.py 로 채점하세요.');
}

$('startBtn').onclick = () => startCall().catch(err => setStatus('마이크/연결 오류: ' + err));
$('stopBtn').onclick = stopCall;
</script>
</body>
</html>
