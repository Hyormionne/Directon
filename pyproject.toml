[project]
name = "directon-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "openai>=2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "soxr>=1.1.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "edge-tts>=7.3.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: 실제 외부 API를 호출하는 테스트(기본 실행에서 제외)"]
addopts = "-m 'not live'"
