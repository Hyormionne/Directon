[project]
name = "directon-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "soxr>=0.5",
    "typesafe-sdk>=0.7",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: 실제 외부 API를 호출하는 테스트(기본 실행에서 제외)"]
addopts = "-m 'not live'"
