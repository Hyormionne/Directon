# AG-T05a 시나리오 원본 (사람이 직접 쓴 발화). scripts/gen_scenarios.py가 읽어 cases.jsonl을 만든다.
#
# 필드 (짧은 키)
#   c:     category (faq / tool_lookup / tool_action / need_info / out_of_scope / complaint_handoff / followup)
#   t:     tags (mid_pause, connective_end, digits, filler_words, self_correction, negation, banmal, long, short)
#          caller_known은 who가 있으면 생성기가 자동으로 붙인다.
#   who:   caller 전화번호(mock_data 회원). 생성기가 {"name","phone","email":null}로 채운다. 없으면 null.
#   now:   "2026-11-20 19:40" 처럼 지정(영업시간 외 테스트). 없으면 생성기가 평일 영업시간 중에서 배정.
#   h:     history [[a|c, 텍스트], ...] — a=상담원, c=고객. 마지막은 상담원.
#   s:     segments. 문자열 하나 = 한 덩어리. 리스트면 [텍스트, 쉼ms] 원소들 + 마지막은 문자열(쉼 0).
#          숫자는 TTS가 읽을 그대로 한글로 적는다.
#   x:     expected_tools [[함수, {인자}], ...]. 세 번째 원소 nf = 키 인자가 의도적으로 틀린 호출(not_found 기대).
#   p:     expected_points (매뉴얼·데이터 근거, 1~3개)
#   n:     must_not (0~2개)
#   style: Gemini 음성 말투 지시(voice_style, 선택)

# ======================================================================
# faq — 정책·영업시간 (함수 없음)
# ======================================================================
- c: faq
  t: [short]
  s: "영업시간이 어떻게 돼요?"
